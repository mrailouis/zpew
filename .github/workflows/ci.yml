name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, configure: macos-debug, build: macos-debug }
          - { os: macos-latest, configure: macos-release, build: macos-release }
          - { os: macos-latest, configure: macos-asan, build: macos-asan }
          - { os: windows-latest, configure: windows-msvc, build: windows-msvc-debug }
          - { os: windows-latest, configure: windows-msvc, build: windows-msvc-release }
          - { os: windows-latest, configure: windows-msvc-asan, build: windows-msvc-asan }
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset ${{ matrix.configure }}
      - run: cmake --build --preset ${{ matrix.build }} --parallel
      - run: ctest --preset ${{ matrix.build }}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx run clang-format==23.1.3 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s python -v

  clang-tidy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install llvm
      - run: cmake --preset macos-debug -DZPEW_ENABLE_CLANG_TIDY=ON -DZPEW_CLANG_TIDY_EXE="$(brew --prefix llvm)/bin/clang-tidy"
      - run: cmake --build --preset macos-debug --parallel
